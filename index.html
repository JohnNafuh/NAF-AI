<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NAF AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">

            <div class="brand">
                <div class="brand-mark">N</div>
                <span>NAF AI</span>
            </div>

            <button class="new-chat" id="newChat">
                <span class="plus">+</span>
                <span>New conversation</span>
            </button>

            <div class="sidebar-section">
                <div class="section-label">CONVERSATIONS</div>
                <div id="chatHistory"></div>
            </div>

            <div class="sidebar-footer">
                <div class="user-card">
                    <div class="user-avatar">N</div>

                    <div class="user-info">
                        <strong>NAF</strong>
                        <span>Personal workspace</span>
                    </div>

                    <button class="more-button">•••</button>
                </div>
            </div>

        </aside>


        <!-- MAIN -->
        <main class="main">

            <header class="topbar">

                <button class="mobile-menu" id="menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

                <div class="mobile-brand">
                    <div class="brand-mark">N</div>
                    <span>NAF AI</span>
                </div>

                <button class="top-action">
                    <span></span>
                    New conversation
                </button>

            </header>


            <!-- CHAT AREA -->
            <section class="chat">

                <!-- WELCOME -->
                <div class="welcome" id="welcome">

                    <div class="hero-mark">
                        <div class="hero-n">N</div>
                    </div>

                    <div class="eyebrow">
                        NAF INTELLIGENCE
                    </div>

                    <h1>
                        What are we<br>
                        <span>building today?</span>
                    </h1>

                    <p class="welcome-text">
                        Think, create, research, analyze and build with
                        your personal AI workspace.
                    </p>


                    <div class="suggestions">

                        <button data-prompt="Help me develop a new business idea">
                            <div class="suggestion-icon">↗</div>
                            <div>
                                <strong>Build an idea</strong>
                                <span>Turn a concept into a plan</span>
                            </div>
                        </button>

                        <button data-prompt="Explain this concept to me simply">
                            <div class="suggestion-icon">◇</div>
                            <div>
                                <strong>Learn something</strong>
                                <span>Understand complex ideas</span>
                            </div>
                        </button>

                        <button data-prompt="Help me write and improve some code">
                            <div class="suggestion-icon">{ }</div>
                            <div>
                                <strong>Write code</strong>
                                <span>Build and solve technical problems</span>
                            </div>
                        </button>

                        <button data-prompt="Help me analyze this information">
                            <div class="suggestion-icon">◌</div>
                            <div>
                                <strong>Analyze</strong>
                                <span>Find patterns and useful insights</span>
                            </div>
                        </button>

                    </div>

                </div>


                <!-- MESSAGES -->
                <div class="messages" id="messages"></div>

            </section>


            <!-- COMPOSER -->
            <div class="composer-area">

                <div class="composer">

                    <button class="attach-button" title="Attach file">
                        +
                    </button>

                    <textarea
                        id="input"
                        rows="1"
                        placeholder="Ask NAF AI anything..."
                    ></textarea>

                    <button class="send-button" id="send" aria-label="Send message">
                        <span>↑</span>
                    </button>

                </div>

                <div class="composer-footer">
                    <span>NAF AI</span>
                    <span>AI can make mistakes. Verify important information.</span>
                </div>

            </div>

        </main>

    </div>


    <script src="app.js"></script>

</body>
</html>
