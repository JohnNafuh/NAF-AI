<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>NAF AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="naf">

        <!-- FLOATING BACKGROUND ELEMENTS -->

        <div class="float float-1"></div>
        <div class="float float-2"></div>
        <div class="float float-3"></div>
        <div class="float float-4"></div>
        <div class="float float-5"></div>


        <!-- LANDING -->

        <section class="landing" id="landing">

            <div class="brand">
                NAF
            </div>

            <button class="btn" id="useAI">
                USE AI
            </button>

        </section>


        <!-- LOADING -->

        <section class="loading" id="loading">

            <div class="rings">

                <div class="ring ring-one"></div>
                <div class="ring ring-two"></div>

            </div>

            <span class="loading-label">
                INITIALIZING NAF AI
            </span>

        </section>


        <!-- AI -->

        <section class="ai-screen" id="aiScreen">

            <div class="ai-top">
                <span>NAF AI</span>
                <span class="online">
                    <i></i>
                    ONLINE
                </span>
            </div>


            <div class="ai-content">

                <div class="question">
                    WHAT CAN NAF
                    <span>DO FOR YOU?</span>
                </div>

                <div class="input-area">

                    <textarea
                        id="prompt"
                        rows="1"
                        placeholder="Ask anything..."
                    ></textarea>

                    <button id="send" aria-label="Send">
                        ↗
                    </button>

                </div>

            </div>


            <div class="ai-footer">
                PERSONAL INTELLIGENCE
            </div>

        </section>

    </main>


    <script src="app.js"></script>

</body>
</html>
