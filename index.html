<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NAF AI | Your personal intelligence</title>
<meta name="description" content="NAF AI is a personal AI assistant for questions, writing, code and ideas.">
<meta name="theme-color" content="#1c2bd8">
<meta property="og:title" content="NAF AI">
<meta property="og:description" content="Ask it plainly. Get it done.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231c2bd8'/%3E%3Ccircle cx='23' cy='9' r='4' fill='%23ff6a1f'/%3E%3Ctext x='5' y='26' font-family='Arial' font-weight='900' font-size='19' fill='white'%3EN%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section class="view landing on" id="landing">
  <canvas id="fx" aria-hidden="true"></canvas>
  <header class="bar"><span class="logo">NAF AI</span></header>
  <div class="hero">
    <h1>Ask it plainly.<br>Get it done.</h1>
    <p>A personal AI for questions, writing, code and ideas. No sign-up needed.</p>
    <button class="cta" id="start">Start chatting</button>
  </div>
  <div class="mark" aria-hidden="true">NAF</div>
</section>

<section class="view chat" id="chat">
  <header class="bar">
    <button class="ghost" id="back">Home</button>
    <span class="logo">NAF AI</span>
    <button class="ghost" id="reset">New chat</button>
  </header>

  <div id="feed" role="log" aria-live="polite">
    <div id="empty">
      <h2>What can NAF do for you?</h2>
      <div class="chips">
        <button data-q="Explain how the internet works in simple terms.">Explain a topic simply</button>
        <button data-q="Help me write a polite follow-up message to a client who has not replied.">Write a message</button>
        <button data-q="Give me five side project ideas for a web developer.">Project ideas</button>
        <button data-q="Give me a practical plan to learn something new in 30 days.">Plan my learning</button>
      </div>
    </div>
  </div>

  <form id="composer" autocomplete="off">
    <textarea id="input" rows="1" placeholder="Message NAF AI" aria-label="Message NAF AI"></textarea>
    <button id="send" type="submit" aria-label="Send message" disabled>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
  <p class="note">NAF AI can make mistakes. Check anything important.</p>
</section>

<script src="app.js"></script>
</body>
</html>
