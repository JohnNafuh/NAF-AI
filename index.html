<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NAF AI</title>
<meta name="description" content="NAF AI is a personal AI assistant for questions, writing, code and ideas.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%233b5bfd'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <span class="logo">NAF AI</span>
    <button id="reset" class="icon" aria-label="New chat" title="New chat">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>

  <main id="feed" role="log" aria-live="polite">
    <div id="empty">
      <h1>How can I help?</h1>
      <p>Ask a question, draft something, or work through an idea.</p>
      <div class="sugg">
        <button data-q="Explain how the internet works in simple terms.">Explain a topic simply</button>
        <button data-q="Help me write a polite follow-up message to a client who has not replied.">Write a message</button>
        <button data-q="Give me five side project ideas for a web developer.">Project ideas</button>
        <button data-q="Give me a practical plan to learn something new in 30 days.">Plan my learning</button>
      </div>
    </div>
  </main>

  <form id="composer" autocomplete="off">
    <textarea id="input" rows="1" placeholder="Message NAF AI" aria-label="Message NAF AI"></textarea>
    <button id="send" type="submit" aria-label="Send message" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
  <p class="note">NAF AI can make mistakes. Check anything important.</p>
</div>
<script src="app.js"></script>
</body>
</html>
